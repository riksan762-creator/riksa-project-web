<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>QR Code SawargiPay</title>

<style>

body{
font-family:system-ui,-apple-system,Arial;
padding:20px;
max-width:700px;
margin:auto;
background:#f5f7fb;
}

.card{
border:1px solid #e0e0e0;
padding:20px;
border-radius:10px;
background:white;
box-shadow:0 6px 20px rgba(0,0,0,0.05);
}

#qrcode{
margin:20px auto;
display:flex;
justify-content:center;
}

label{
margin-top:10px;
display:block;
font-weight:600;
}

input{
width:100%;
padding:10px;
margin-top:6px;
border-radius:6px;
border:1px solid #ccc;
}

button{
margin-top:12px;
margin-right:8px;
padding:10px 16px;
border:none;
border-radius:6px;
background:#0b74ff;
color:white;
cursor:pointer;
font-weight:600;
}

button.secondary{
background:#444;
}

button:hover{
opacity:0.9;
}

</style>

</head>
<body>

<h2>QR Code SawargiPay</h2>

<div class="card">

<label>Link Website</label>
<input id="url" value="https://sawargipay.com">

<label>Ukuran QR (px)</label>
<input id="size" type="number" value="300" min="100" max="1000">

<br>

<button id="generate">Generate QR</button>
<button id="downloadPNG" class="secondary">Download PNG</button>
<button id="downloadPDF" class="secondary">Download PDF</button>

<div id="qrcode"></div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

const qrContainer = document.getElementById("qrcode")
const urlInput = document.getElementById("url")
const sizeInput = document.getElementById("size")

let qr

function generateQR(){

let url = urlInput.value.trim()
let size = parseInt(sizeInput.value)

qrContainer.innerHTML=""

qr = new QRCode(qrContainer,{
text:url,
width:size,
height:size,
correctLevel:QRCode.CorrectLevel.H
})

}

generateQR()

document.getElementById("generate").onclick=generateQR


function getQRCanvas(){

let canvas = qrContainer.querySelector("canvas")

if(!canvas){
alert("QR belum dibuat")
return null
}

return canvas

}



document.getElementById("downloadPNG").onclick=function(){

let canvas = getQRCanvas()

if(!canvas) return

let link=document.createElement("a")

link.download="qr-sawargipay.png"
link.href=canvas.toDataURL("image/png")

link.click()

}



document.getElementById("downloadPDF").onclick=function(){

let canvas=getQRCanvas()

if(!canvas) return

let img=canvas.toDataURL("image/png")

const {jsPDF}=window.jspdf

let pdf=new jsPDF("p","mm","a4")

let size=120

let x=(210-size)/2
let y=(297-size)/2

pdf.addImage(img,"PNG",x,y,size,size)

pdf.save("qr-sawargipay.pdf")

}

</script>

</body>
</html>
