<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>QR Studio Pro — Professional Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Menggunakan Library yang lebih advanced untuk styling QR -->
    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.1) 0px, transparent 50%), 
                              radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 60px 20px 40px;
        }

        header h1 {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(90deg, #4f46e5, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p { color: var(--text-muted); margin-top: 10px; font-size: 1.1rem; }

        .main-container {
            max-width: 1100px;
            margin: 0 auto 60px;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .main-container { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 32px;
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group { margin-bottom: 20px; }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        input[type="text"], input[type="color"], select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Preview Sidebar */
        .preview-sticky {
            position: sticky;
            top: 30px;
        }

        .qr-display-card {
            background: white;
            border-radius: var(--radius);
            padding: 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        #canvas-container {
            margin: 20px auto;
            background: white;
            padding: 10px;
            display: inline-block;
        }

        .qr-label-preview {
            font-weight: 700;
            font-size: 22px;
            margin-bottom: 10px;
        }

        .download-options {
            margin-top: 25px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .btn-download {
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #1e293b;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 13px;
        }

        .btn-download:hover { background: #000; transform: translateY(-2px); }
        .btn-download.primary { background: var(--primary); }
        .btn-download.primary:hover { background: var(--primary-hover); }

        .file-custom {
            position: relative;
            display: inline-block;
            width: 100%;
            cursor: pointer;
        }

        input[type="file"] {
            border: 1px dashed #cbd5e1;
            padding: 10px;
            width: 100%;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<header>
    <h1>QR Studio Pro</h1>
    <p>Ciptakan identitas digital yang estetik dalam hitungan detik.</p>
</header>

<div class="main-container">
    <!-- CONFIGURATION -->
    <div class="card">
        <div class="section-title">⚙️ Konfigurasi QR</div>
        
        <div class="input-group">
            <label>Teks / URL Website</label>
            <input type="text" id="url" placeholder="https://sawargipay.com" oninput="updateQR()">
        </div>

        <div class="input-group">
            <label>Label Atas (Scan Me)</label>
            <input type="text" id="labelText" placeholder="SCAN ME" oninput="updateLabel()">
        </div>

        <div class="grid-inputs">
            <div class="input-group">
                <label>Warna QR</label>
                <input type="color" id="dotColor" value="#4f46e5" onchange="updateQR()">
            </div>
            <div class="input-group">
                <label>Warna Background</label>
                <input type="color" id="bgColor" value="#ffffff" onchange="updateQR()">
            </div>
        </div>

        <div class="grid-inputs">
            <div class="input-group">
                <label>Bentuk Titik (Dots)</label>
                <select id="dotStyle" onchange="updateQR()">
                    <option value="rounded">Rounded</option>
                    <option value="dots">Dots</option>
                    <option value="classy">Classy</option>
                    <option value="square" selected>Square</option>
                    <option value="extra-rounded">Extra Rounded</option>
                </select>
            </div>
            <div class="input-group">
                <label>Bentuk Sudut (Corners)</label>
                <select id="cornerStyle" onchange="updateQR()">
                    <option value="square">Square</option>
                    <option value="dot">Dot</option>
                    <option value="extra-rounded" selected>Rounded</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <label>Tambah Logo (Tengah)</label>
            <input type="file" id="logoInput" accept="image/*" onchange="handleLogo(event)">
        </div>
    </div>

    <!-- PREVIEW AREA -->
    <div class="preview-sticky">
        <div class="qr-display-card">
            <div class="qr-label-preview" id="previewLabel">SCAN ME</div>
            <div id="canvas-container"></div>
            
            <div class="download-options">
                <button class="btn-download primary" onclick="download('png')">PNG</button>
                <button class="btn-download" onclick="download('svg')">SVG</button>
                <button class="btn-download" onclick="downloadPDF()">PDF</button>
            </div>
        </div>
    </div>
</div>

<script>
    let logoData = "";
    
    // Inisialisasi QR Code Styling
    const qrCode = new QRCodeStyling({
        width: 300,
        height: 300,
        type: "svg",
        data: "https://sawargipay.com",
        image: "",
        dotsOptions: { color: "#4f46e5", type: "square" },
        backgroundOptions: { color: "#ffffff" },
        imageOptions: { crossOrigin: "anonymous", margin: 5, imageSize: 0.4 }
    });

    // Render pertama kali
    qrCode.append(document.getElementById("canvas-container"));

    function updateQR() {
        const url = document.getElementById("url").value || "https://sawargipay.com";
        const dotColor = document.getElementById("dotColor").value;
        const bgColor = document.getElementById("bgColor").value;
        const dotStyle = document.getElementById("dotStyle").value;
        const cornerStyle = document.getElementById("cornerStyle").value;

        qrCode.update({
            data: url,
            dotsOptions: { color: dotColor, type: dotStyle },
            backgroundOptions: { color: bgColor },
            cornersSquareOptions: { type: cornerStyle, color: dotColor },
            image: logoData
        });
    }

    function updateLabel() {
        const val = document.getElementById("labelText").value;
        document.getElementById("previewLabel").innerText = val || "SCAN ME";
    }

    function handleLogo(event) {
        const file = event.target.files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            logoData = e.target.result;
            updateQR();
        };
        reader.readAsDataURL(file);
    }

    function download(extension) {
        qrCode.download({ name: "qr-studio-pro", extension: extension });
    }

    async function downloadPDF() {
        // Menggunakan library jspdf untuk hasil yang lebih rapi
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF();
        
        // Ambil data gambar dari canvas/svg
        qrCode._canvas.toBlob((blob) => {
            const reader = new FileReader();
            reader.onload = function() {
                pdf.text("Generated by QR Studio Pro", 105, 20, { align: "center" });
                pdf.addImage(reader.result, 'PNG', 40, 40, 130, 130);
                pdf.save("qr-code.pdf");
            };
            reader.readAsDataURL(blob);
        }, 'image/png');
    }
</script>

</body>
</html>
