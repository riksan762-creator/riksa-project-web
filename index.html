<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>QR Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Inter,system-ui;
background:linear-gradient(140deg,#eef2ff,#f8fafc);
min-height:100vh;
color:#0f172a;
}

/* HEADER */

header{
text-align:center;
padding:50px 20px;
}

header h1{
font-size:34px;
font-weight:700;
}

header p{
margin-top:8px;
color:#64748b;
}

/* CONTAINER */

.container{
max-width:720px;
margin:auto;
padding:20px;
}

/* CARD */

.card{
background:white;
border-radius:22px;
padding:30px;
box-shadow:0 20px 60px rgba(0,0,0,0.08);
}

/* INPUT */

label{
display:block;
margin-top:15px;
font-weight:600;
font-size:13px;
}

input{
width:100%;
padding:13px;
margin-top:6px;
border-radius:12px;
border:1px solid #e2e8f0;
font-size:14px;
}

/* BUTTON */

.generate{
margin-top:20px;
width:100%;
padding:14px;
border-radius:12px;
border:0;
font-weight:600;
cursor:pointer;
background:linear-gradient(90deg,#2563eb,#4f46e5);
color:white;
font-size:15px;
transition:0.2s;
}

.generate:hover{
transform:translateY(-2px);
box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

/* QR PREVIEW */

.preview{
margin-top:40px;
text-align:center;
}

.qr-card{
display:inline-block;
background:white;
padding:40px;
border-radius:25px;
box-shadow:0 25px 60px rgba(0,0,0,0.1);
}

.qr-title{
font-size:20px;
font-weight:700;
margin-bottom:15px;
}

/* QR */

.qr-wrapper{
position:relative;
width:300px;
margin:auto;
}

#qrcode canvas{
width:300px!important;
height:300px!important;
}

/* LOGO */

.qr-logo{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:70px;
height:70px;
border-radius:14px;
background:white;
padding:6px;
box-shadow:0 8px 20px rgba(0,0,0,0.2);
display:none;
}

/* DOWNLOAD */

.download-section{
margin-top:25px;
}

.download-title{
font-size:14px;
font-weight:600;
margin-bottom:10px;
color:#334155;
}

.download-buttons{
display:flex;
justify-content:center;
gap:12px;
}

.download-buttons button{
padding:12px 20px;
border:none;
border-radius:10px;
background:#0f172a;
color:white;
font-weight:600;
cursor:pointer;
transition:.2s;
}

.download-buttons button:hover{
transform:translateY(-2px);
box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

</style>
</head>

<body>

<header>

<h1>QR Studio</h1>
<p>Buat QR Code untuk website atau link dengan mudah</p>

</header>

<div class="container">

<div class="card">

<label>Masukkan URL Website</label>
<input id="url" placeholder="contoh: sawargipay.com">

<label>Warna QR</label>
<input type="color" id="color" value="#000000">

<label>Upload Logo (opsional)</label>
<input type="file" id="logo">

<button class="generate" onclick="generateQR()">Generate QR Code</button>

</div>

<div class="preview">

<div class="qr-card" id="qrCard">

<div class="qr-title">Scan Me</div>

<div class="qr-wrapper">

<div id="qrcode"></div>
<img id="qrLogo" class="qr-logo">

</div>

</div>

<div class="download-section">

<div class="download-title">Download QR Code</div>

<div class="download-buttons">

<button onclick="downloadPNG()">PNG</button>
<button onclick="downloadPDF()">PDF</button>
<button onclick="downloadSVG()">SVG</button>

</div>

</div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

let qr

function formatURL(url){
url=url.trim()
if(!url.startsWith("http://") && !url.startsWith("https://")){
url="https://"+url
}
return url
}

function generateQR(){

let url=formatURL(document.getElementById("url").value)

let color=document.getElementById("color").value

let container=document.getElementById("qrcode")

container.innerHTML=""

qr=new QRCode(container,{
text:url,
width:300,
height:300,
colorDark:color,
colorLight:"#ffffff",
correctLevel:QRCode.CorrectLevel.H
})

}

/* LOGO */

document.getElementById("logo").addEventListener("change",function(){

let file=this.files[0]
if(!file)return

let reader=new FileReader()

reader.onload=function(e){

let logo=document.getElementById("qrLogo")

logo.src=e.target.result
logo.style.display="block"

}

reader.readAsDataURL(file)

})

generateQR()

/* EXPORT */

async function exportCanvas(){
return await html2canvas(document.getElementById("qrCard"),{scale:4})
}

async function downloadPNG(){

let canvas=await exportCanvas()

let link=document.createElement("a")
link.download="qr-code.png"
link.href=canvas.toDataURL("image/png")
link.click()

}

async function downloadPDF(){

let canvas=await exportCanvas()

let img=canvas.toDataURL("image/png")

const {jsPDF}=window.jspdf

let pdf=new jsPDF("p","mm","a4")

pdf.addImage(img,"PNG",25,40,160,160)

pdf.save("qr-code.pdf")

}

async function downloadSVG(){

let canvas=await exportCanvas()

let img=canvas.toDataURL("image/png")

let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500">
<image href="${img}" width="500" height="500"/>
</svg>`

let blob=new Blob([svg],{type:"image/svg+xml"})

let link=document.createElement("a")

link.href=URL.createObjectURL(blob)

link.download="qr-code.svg"

link.click()

}

</script>

</body>
</html>
